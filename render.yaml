services:
  - type: web
    name: nwo-signal-spectrum
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      # Belt-and-suspenders: .python-version file ALSO pins this, but Render
      # honors PYTHON_VERSION too. Both pinning mechanisms reinforce each other.
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OSIRIS_API_URL
        sync: false
      - key: OSIRIS_API_KEY
        sync: false
      - key: NASA_API_KEY
        sync: false
      - key: ADSBEXCHANGE_API_KEY
        sync: false
      - key: NWO_AUTH_DOMAIN
        value: nwo.capital
      - key: CORS_ORIGINS
        value: https://nwo.capital
      - key: APP_VERSION
        value: 2.0.0
      - key: LOG_LEVEL
        value: INFO
