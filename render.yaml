services:
  # ============================================================
  # Web API — uvicorn FastAPI app
  # ============================================================
  - type: web
    name: nwo-signal-spectrum
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OSIRIS_API_URL
        sync: false
      - key: OSIRIS_API_KEY
        sync: false
      - key: NASA_API_KEY
        sync: false
      - key: ADSBEXCHANGE_API_KEY
        sync: false
      - key: NWO_AUTH_DOMAIN
        value: nwo.capital
      # ----------------------------------------------------------
      # CORS — the apocalypse globe lives on a HuggingFace Space
      # at https://cpater-nwo-apocalypse.hf.space. Including it
      # here is required or every fetch from the globe will fail
      # with a CORS error (manifests as "OFFLINE" + 0 entities).
      # ----------------------------------------------------------
      - key: CORS_ORIGINS
        value: https://nwo.capital,https://cpater-nwo-apocalypse.hf.space,https://huggingface.co
      - key: APP_VERSION
        value: 2.1.0
      - key: LOG_LEVEL
        value: INFO
      # ----------------------------------------------------------
      # Optional ingester credentials (all open-data sources work
      # without them, but auth lifts rate limits significantly).
      # ----------------------------------------------------------
      - key: OPENSKY_USERNAME
        sync: false
      - key: OPENSKY_PASSWORD
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
      # ----------------------------------------------------------
      # v2.1 layer credentials. Each layer no-ops gracefully if
      # the key is missing, but presence enables the ingester and
      # populates the corresponding spectrum.* table.
      # ----------------------------------------------------------
      - key: ACLED_API_KEY              # conflict_events layer (ACLED free tier)
        sync: false
      - key: ABUSEIPDB_API_KEY          # cyber_indicators
        sync: false
      - key: PULSEDIVE_API_KEY          # cyber_indicators
        sync: false
      - key: VIRUSTOTAL_API_KEY         # cyber_indicators
        sync: false
      # ----------------------------------------------------------
      # Consensus network gating.  RECOMMENDED EMPTY for public
      # deployments — leave unset and any authenticated wallet
      # can register as a network agent.  Populate (comma-separated
      # wallet addresses) only if you intentionally want a curated
      # private network.
      # ----------------------------------------------------------
      - key: NWO_AGENT_ALLOWLIST
        sync: false
      # ----------------------------------------------------------
      # Shared secret the cron services use to call protected
      # internal endpoints (/api/v1/layers/refresh-due,
      # /api/v1/layers/bootstrap-country, /api/v1/apocalypse/check).
      # Generate once:  openssl rand -base64 32
      # Set the SAME value on every cron service below.
      # ----------------------------------------------------------
      - key: INTERNAL_CRON_TOKEN
        sync: false

  # ============================================================
  # Cron — run the seven apocalypse detectors every 15 minutes
  # ============================================================
  # This is the heartbeat of the unified L ∈ {0..5} indicator.
  # Without this cron, the apocalypse level only recomputes on
  # manual trigger and goes stale within an hour. The endpoint
  # runs all seven detectors (aviation, seismic, solar, radiation,
  # asteroid, RF, RSS) and fuses to the unified level + δ_tie.
  # ============================================================
  - type: cron
    name: nwo-spectrum-apocalypse-check
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    schedule: "*/15 * * * *"
    buildCommand: pip install --upgrade pip httpx
    startCommand: |
      python -c "
      import os, httpx
      url = os.environ['SERVICE_URL'].rstrip('/') + '/api/v1/apocalypse/check'
      token = os.environ['INTERNAL_CRON_TOKEN']
      r = httpx.post(url, headers={'Authorization': f'Bearer {token}'}, timeout=300)
      print(r.status_code, r.text[:500])
      r.raise_for_status()
      "
    envVars:
      - key: SERVICE_URL
        value: https://nwo-signal-spectrum.onrender.com
      - key: INTERNAL_CRON_TOKEN
        sync: false

  # ============================================================
  # Cron — refresh all realtime layers every 5 minutes
  # ============================================================
  # Hits the web service over the public URL with a shared bearer
  # token. The /api/v1/layers/refresh-due endpoint iterates over
  # layers whose `last_run_at + refresh_minutes < now()` and runs
  # the corresponding ingester (satellites, flights, weather,
  # ocean, atmosphere, geology, ships, conflict, cyber, uap).
  #
  # Render cron services run a one-shot command on the schedule
  # and exit; there is no long-running process to drain memory.
  # ============================================================
  - type: cron
    name: nwo-spectrum-refresh-due
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    schedule: "*/5 * * * *"
    buildCommand: pip install --upgrade pip httpx
    startCommand: |
      python -c "
      import os, sys, httpx
      url = os.environ['SERVICE_URL'].rstrip('/') + '/api/v1/layers/refresh-due'
      token = os.environ['INTERNAL_CRON_TOKEN']
      r = httpx.post(url, headers={'Authorization': f'Bearer {token}'}, timeout=300)
      print(r.status_code, r.text[:500])
      r.raise_for_status()
      "
    envVars:
      - key: SERVICE_URL
        value: https://nwo-signal-spectrum.onrender.com
      - key: INTERNAL_CRON_TOKEN
        sync: false

  # ============================================================
  # Cron — daily bootstrap of OSM-backed layers for priority
  # countries (military bases, hospitals, embassies, etc.)
  # ============================================================
  # OSM data is static enough that we only need to pull it once
  # per country per day. Adjust the country list to your priorities.
  # ============================================================
  - type: cron
    name: nwo-spectrum-bootstrap-countries
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    schedule: "30 3 * * *"   # 03:30 UTC daily
    buildCommand: pip install --upgrade pip httpx
    startCommand: |
      python -c "
      import os, httpx
      url_base = os.environ['SERVICE_URL'].rstrip('/') + '/api/v1/layers/bootstrap-country'
      token = os.environ['INTERNAL_CRON_TOKEN']
      countries = os.environ.get('BOOTSTRAP_COUNTRIES', 'NO,SE,DK,FI,IS,GB,DE,FR,NL,US,CA,JP,KR,AU').split(',')
      for iso2 in countries:
          iso2 = iso2.strip().upper()
          if not iso2:
              continue
          print(f'bootstrapping {iso2}...')
          try:
              r = httpx.post(url_base,
                  headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
                  json={'iso2': iso2},
                  timeout=900)
              print(' ->', r.status_code, r.text[:200])
          except Exception as e:
              print(' ->', repr(e))
      "
    envVars:
      - key: SERVICE_URL
        value: https://nwo-signal-spectrum.onrender.com
      - key: INTERNAL_CRON_TOKEN
        sync: false
      - key: BOOTSTRAP_COUNTRIES
        value: NO,SE,DK,FI,IS,GB,DE,FR,NL,US,CA,JP,KR,AU
