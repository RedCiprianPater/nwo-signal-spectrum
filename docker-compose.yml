version: '3.8'

services:
  # PHP API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./logs:/var/log/apache2
    environment:
      - DB_HOST=mysql
      - DB_NAME=nwo_spectrum
      - DB_USER=root
      - DB_PASS=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    networks:
      - nwo-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=nwo_spectrum
      - MYSQL_USER=spectrum
      - MYSQL_PASSWORD=spectrum
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./schema-apocalypse.sql:/docker-entrypoint-initdb.d/02-apocalypse.sql
    ports:
      - "3306:3306"
    networks:
      - nwo-network

  # Redis for real-time
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nwo-network

  # WebSocket Server
  websocket:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - api
    networks:
      - nwo-network

  # Spectrum Monitor (Python)
  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    environment:
      - API_URL=http://api:80
      - REDIS_HOST=redis
    depends_on:
      - api
      - redis
    devices:
      - "/dev/bus/usb:/dev/bus/usb"  # For RTL-SDR
    privileged: true
    networks:
      - nwo-network

  # Apocalypse Checker (Cron)
  apocalypse:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "while true; do
        php scripts/apocalypse-check.php;
        sleep 900;
      done"
    environment:
      - DB_HOST=mysql
      - DB_NAME=nwo_spectrum
      - DB_USER=root
      - DB_PASS=root
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - nwo-network

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - nwo-network

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - nwo-network

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  nwo-network:
    driver: bridge
